[www]
user  = www-data
group = www-data

listen = 127.0.0.1:9000

; ondemand : spawn uniquement à la demande, libère la RAM entre les pics
; Adapté PaaS avec ressources limitées (1-2 vCPU, 512MB-2GB)
; ~25 workers × 45MB = ~1125MB max, laisse de la marge pour DB/Redis/Nginx
pm                        = ondemand
pm.max_children           = 25
pm.process_idle_timeout   = 10s
pm.max_requests           = 500

; Timeout
request_terminate_timeout = 60

; Logs
catch_workers_output       = yes
php_flag[display_errors]   = off
php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on

; Passer les variables d'env au processus PHP
clear_env = no
