user www-data;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript application/xml
        application/rss+xml application/atom+xml
        image/svg+xml;

    limit_req_zone $binary_remote_addr zone=api:10m    rate=180r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m   rate=10r/m;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=20r/m;

    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent rt=$request_time';
    access_log /dev/stdout main;

    server {
        listen 80;
        server_name _;

        root  /app/public;
        index index.php;

        add_header X-Frame-Options          "SAMEORIGIN"                   always;
        add_header X-Content-Type-Options   "nosniff"                      always;
        add_header X-XSS-Protection         "1; mode=block"                always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        client_max_body_size 25M;

        location ~ ^/api/(admin/login|admin/logout|client/login|client/register|password) {
            limit_req zone=auth burst=5 nodelay;
            limit_req_status 429;
            try_files $uri /index.php?$query_string;
        }

        location ~ ^/api/admin/produits {
            limit_req zone=upload burst=10 nodelay;
            limit_req_status 429;
            try_files $uri /index.php?$query_string;
        }

        location / {
            limit_req zone=api burst=60 nodelay;
            limit_req_status 429;
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass            127.0.0.1:9000;
            fastcgi_index           index.php;
            fastcgi_param           SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include                 fastcgi_params;
            fastcgi_read_timeout    60;
            fastcgi_buffers         16 32k;
            fastcgi_buffer_size     32k;
            fastcgi_busy_buffers_size 64k;
        }

        location ~* ^/storage/.*\.(jpg|jpeg|png|gif|webp|svg|ico)$ {
            expires     30d;
            add_header  Cache-Control "public, no-transform";
            access_log  off;
        }

        location ~ /\. {
            deny all;
            return 404;
        }

        location ~* ^/storage/.*\.php$ {
            deny all;
            return 403;
        }
    }
}
