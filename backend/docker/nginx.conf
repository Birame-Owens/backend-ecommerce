user www-data;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;

    # Cache FastCGI — GET publics servis depuis RAM, PHP-FPM pas touché
    fastcgi_cache_path /tmp/nginx_fcgi_cache
        levels=1:2
        keys_zone=api_public:20m
        max_size=200m
        inactive=3m
        use_temp_path=off;

    # Décision de cache : routes publiques uniquement
    map $request_uri $uri_skip_cache {
        default                                                        0;
        "~^/api/admin"                                                 1;
        "~^/api/client/(login|register|logout|me|commandes|checkout|coupon)" 1;
        "~^/(api/user|sanctum)"                                        1;
    }
    map $http_cookie $cookie_skip_cache {
        default          0;
        "~ndeya_session" 1;
    }

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript application/xml
        application/rss+xml application/atom+xml
        image/svg+xml;

    limit_req_zone $binary_remote_addr zone=api:10m    rate=180r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m   rate=10r/m;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=20r/m;

    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent rt=$request_time';
    access_log /dev/stdout main;

    server {
        listen 80;
        server_name _;

        root  /app/public;
        index index.php;

        add_header X-Frame-Options          "SAMEORIGIN"                   always;
        add_header X-Content-Type-Options   "nosniff"                      always;
        add_header X-XSS-Protection         "1; mode=block"                always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        client_max_body_size 25M;

        location ~ ^/api/(admin/login|admin/logout|client/login|client/register|password) {
            limit_req zone=auth burst=5 nodelay;
            limit_req_status 429;
            try_files $uri /index.php?$query_string;
        }

        location ~ ^/api/admin/produits {
            limit_req zone=upload burst=10 nodelay;
            limit_req_status 429;
            try_files $uri /index.php?$query_string;
        }

        location / {
            limit_req zone=api burst=60 nodelay;
            limit_req_status 429;
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass            127.0.0.1:9000;
            fastcgi_index           index.php;
            fastcgi_param           SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include                 fastcgi_params;
            fastcgi_keep_conn       on;
            fastcgi_read_timeout    60;
            fastcgi_buffers         16 32k;
            fastcgi_buffer_size     32k;
            fastcgi_busy_buffers_size 64k;

            # Cache : skip si POST/PUT/DELETE, admin, auth, ou session active
            set $skip 0;
            if ($request_method != GET) { set $skip 1; }
            if ($uri_skip_cache)        { set $skip 1; }
            if ($cookie_skip_cache)     { set $skip 1; }

            fastcgi_cache            api_public;
            fastcgi_cache_key        "$request_method|$host|$request_uri";
            fastcgi_cache_valid       200 2m;
            fastcgi_cache_valid       404 30s;
            fastcgi_cache_bypass     $skip;
            fastcgi_no_cache         $skip;
            fastcgi_cache_lock       on;
            fastcgi_cache_lock_timeout 3s;
            # Servir l'ancien cache si PHP-FPM est surchargé (filet de sécurité)
            fastcgi_cache_use_stale  error timeout updating http_500 http_502 http_503;

            add_header X-Cache-Status $upstream_cache_status always;
        }

        location ~* ^/storage/.*\.(jpg|jpeg|png|gif|webp|svg|ico)$ {
            expires     30d;
            add_header  Cache-Control "public, no-transform";
            access_log  off;
        }

        location ~ /\. {
            deny all;
            return 404;
        }

        location ~* ^/storage/.*\.php$ {
            deny all;
            return 403;
        }
    }
}
