user www-data;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript application/xml
        application/rss+xml application/atom+xml
        image/svg+xml;

    # ── Cache FastCGI ─────────────────────────────────────────────────────────
    # Les endpoints publics GET sont servis depuis RAM — PHP-FPM pas touché
    fastcgi_cache_path /tmp/nginx_fcgi_cache
        levels=1:2
        keys_zone=api_public:20m
        max_size=200m
        inactive=3m
        use_temp_path=off;

    # ── Rate limiting ─────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m    rate=180r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m   rate=10r/m;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=20r/m;

    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent rt=$request_time cache=$upstream_cache_status';
    access_log /dev/stdout main;

    server {
        listen 80;
        server_name _;

        root  /app/public;
        index index.php;

        add_header X-Frame-Options          "SAMEORIGIN"                   always;
        add_header X-Content-Type-Options   "nosniff"                      always;
        add_header X-XSS-Protection         "1; mode=block"                always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        client_max_body_size 25M;

        # ── Décision de cache ─────────────────────────────────────────────────
        # Par défaut : pas de cache
        set $skip_cache 1;

        # GET sur routes client publiques → cacher
        if ($request_method = GET)  { set $skip_cache 0; }
        # Admin, auth, données personnelles → jamais cacher
        if ($request_uri ~* "^/api/admin")                          { set $skip_cache 1; }
        if ($request_uri ~* "^/api/client/(login|register|logout|me|commandes|checkout|coupon)") { set $skip_cache 1; }
        if ($request_uri ~* "^/(api/user|sanctum)")                 { set $skip_cache 1; }
        # Utilisateur connecté (cookie session) → jamais cacher
        if ($http_cookie ~* "ndeya_session")                        { set $skip_cache 1; }

        # ── Routes auth ───────────────────────────────────────────────────────
        location ~ ^/api/(admin/login|admin/logout|client/login|client/register|password) {
            limit_req zone=auth burst=5 nodelay;
            limit_req_status 429;
            try_files $uri /index.php?$query_string;
        }

        # ── Upload images ─────────────────────────────────────────────────────
        location ~ ^/api/admin/produits {
            limit_req zone=upload burst=10 nodelay;
            limit_req_status 429;
            try_files $uri /index.php?$query_string;
        }

        # ── Toutes les autres routes ──────────────────────────────────────────
        location / {
            limit_req zone=api burst=60 nodelay;
            limit_req_status 429;
            try_files $uri $uri/ /index.php?$query_string;
        }

        # ── PHP-FPM avec cache FastCGI ────────────────────────────────────────
        location ~ \.php$ {
            fastcgi_pass            127.0.0.1:9000;
            fastcgi_index           index.php;
            fastcgi_param           SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include                 fastcgi_params;
            fastcgi_read_timeout    60;
            fastcgi_buffers         16 32k;
            fastcgi_buffer_size     32k;
            fastcgi_busy_buffers_size 64k;

            # Cache
            fastcgi_cache           api_public;
            fastcgi_cache_key       "$request_method|$host|$request_uri";
            fastcgi_cache_valid      200 2m;
            fastcgi_cache_valid      404 30s;
            fastcgi_cache_bypass    $skip_cache;
            fastcgi_no_cache        $skip_cache;
            # Anti-stampede : une seule requête reconstruit le cache, les autres attendent
            fastcgi_cache_lock      on;
            fastcgi_cache_lock_timeout 3s;
            # Servir le cache périmé si PHP-FPM est surchargé (filet de sécurité critique)
            fastcgi_cache_use_stale error timeout updating http_500 http_502 http_503;

            add_header X-Cache-Status $upstream_cache_status always;
        }

        location ~* ^/storage/.*\.(jpg|jpeg|png|gif|webp|svg|ico)$ {
            expires     30d;
            add_header  Cache-Control "public, no-transform";
            access_log  off;
        }

        location ~ /\. {
            deny all;
            return 404;
        }

        location ~* ^/storage/.*\.php$ {
            deny all;
            return 403;
        }
    }
}
