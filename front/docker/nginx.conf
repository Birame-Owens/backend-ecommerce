user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;

    sendfile   on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Gzip
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript text/javascript
        application/x-javascript image/svg+xml;

    server {
        listen 80;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # Headers sécurité
        add_header X-Frame-Options        "SAMEORIGIN"                      always;
        add_header X-Content-Type-Options "nosniff"                         always;
        add_header X-XSS-Protection       "1; mode=block"                   always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # index.html — jamais en cache (SPA entry point)
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma        "no-cache";
            add_header Expires       "0";
        }

        # robots.txt est servi directement depuis /usr/share/nginx/html.
        location = /robots.txt {
            try_files /robots.txt =404;
            add_header Content-Type "text/plain; charset=utf-8";
        }

        # SEO public dynamique: redirige vers l'API, qui expose ces fichiers.
        # Le proxy HTTPS depuis ce conteneur peut retourner 502 selon le reseau de prod.
        location ~ ^/(sitemap\.xml|llms\.txt|products-feed\.json)$ {
            return 302 https://api.nd-world.site$request_uri;
        }

        # Assets Vite (noms hashés) — cache 1 an
        location ~* \.(js|css|woff|woff2|ttf|eot|ico)$ {
            expires    1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Images
        location ~* \.(png|jpg|jpeg|gif|svg|webp)$ {
            expires    30d;
            add_header Cache-Control "public, no-transform";
            access_log off;
        }

        # SPA routing — toutes les routes vers index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Bloquer les fichiers cachés
        location ~ /\. {
            deny all;
            return 404;
        }
    }
}
