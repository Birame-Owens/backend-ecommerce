user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;

    sendfile   on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Gzip
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript text/javascript
        application/x-javascript image/svg+xml;

    # ── Dynamic rendering : les robots/IA reçoivent le HTML SEO du backend ──
    map $http_user_agent $ndw_bot {
        default 0;
        "~*(googlebot|bingbot|yandexbot|duckduckbot|baiduspider|applebot|gptbot|oai-searchbot|chatgpt-user|claudebot|claude-web|anthropic-ai|perplexitybot|google-extended|cohere-ai|ccbot|bytespider|amazonbot|facebookexternalhit|facebot|twitterbot|linkedinbot|whatsapp|slackbot|telegrambot|discordbot|pinterest)" 1;
    }
    map $uri $ndw_page {
        default 1;
        "~*\.(js|mjs|css|map|png|jpg|jpeg|gif|svg|webp|ico|woff2?|ttf|eot|json|xml|txt|pdf|mp4|webm)$" 0;
    }
    map "$ndw_bot$ndw_page" $ndw_prerender {
        default 0;
        "11" 1;
    }

    server {
        listen 80;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # Headers sécurité
        add_header X-Frame-Options        "SAMEORIGIN"                      always;
        add_header X-Content-Type-Options "nosniff"                         always;
        add_header X-XSS-Protection       "1; mode=block"                   always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # index.html — jamais en cache (SPA entry point)
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma        "no-cache";
            add_header Expires       "0";
        }

        # robots.txt est servi directement depuis /usr/share/nginx/html.
        location = /robots.txt {
            try_files /robots.txt =404;
            add_header Content-Type "text/plain; charset=utf-8";
        }

        # SEO public dynamique: redirige vers l'API, qui expose ces fichiers.
        # Le proxy HTTPS depuis ce conteneur peut retourner 502 selon le reseau de prod.
        location ~ ^/(sitemap\.xml|llms\.txt|products-feed\.json)$ {
            return 302 https://api.nd-world.site$request_uri;
        }

        # Assets Vite (noms hashés) — cache 1 an
        location ~* \.(js|css|woff|woff2|ttf|eot|ico)$ {
            expires    1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Images
        location ~* \.(png|jpg|jpeg|gif|svg|webp)$ {
            expires    30d;
            add_header Cache-Control "public, no-transform";
            access_log off;
        }

        # SPA routing — robots vers le rendu SEO backend, humains vers le SPA
        location / {
            if ($ndw_prerender) {
                rewrite ^ /__prerender__$uri last;
            }
            try_files $uri $uri/ /index.html;
        }

        # Rendu SEO (interne) : proxy vers l'API. Si echec -> fallback SPA (jamais de 502 au bot).
        location ~ ^/__prerender__(/.*)$ {
            internal;
            resolver 1.1.1.1 8.8.8.8 valid=300s;
            set $ndw_target "https://api.nd-world.site/seo-render$1";
            proxy_pass $ndw_target;
            proxy_ssl_server_name on;
            proxy_set_header Host api.nd-world.site;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 8s;
            proxy_intercept_errors on;
            error_page 502 503 504 = @ndw_spa;
        }

        location @ndw_spa {
            try_files /index.html =404;
        }

        # Bloquer les fichiers cachés
        location ~ /\. {
            deny all;
            return 404;
        }
    }
}
