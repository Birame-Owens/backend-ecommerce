<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/ND-world.jpeg" />
    <link rel="apple-touch-icon" href="/ND-world.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ND WORLD est une boutique en ligne au Senegal. Decouvrez montres, chaussures, sacs, accessoires et produits tendance avec livraison a Dakar et partout au Senegal." />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <title>ND WORLD | Boutique en ligne au Senegal</title>

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn…) -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://nd-world.site/" />
    <meta property="og:title"       content="ND WORLD — Mode & Style" />
    <meta property="og:description" content="Découvrez nos collections de mode tendance. Livraison partout au Sénégal." />
    <meta property="og:image"       content="https://nd-world.site/ND-world.jpeg" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale"      content="fr_FR" />
    <meta property="og:site_name"   content="ND WORLD" />

    <!-- Twitter / X -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="ND WORLD — Mode & Style" />
    <meta name="twitter:description" content="Découvrez nos collections de mode tendance. Livraison partout au Sénégal." />
    <meta name="twitter:image"       content="https://nd-world.site/ND-world.jpeg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "ND WORLD",
        "url": "https://nd-world.site/",
        "description": "Boutique en ligne au Senegal avec livraison a Dakar et partout au pays.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://nd-world.site/recherche?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <!-- Splash de chargement : remplacé par React au montage (évite le flash de texte). -->
      <div id="app-splash" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#ffffff;z-index:9999">
        <img src="/ND-world.jpeg" alt="ND WORLD" width="140" height="140" style="border-radius:20px;box-shadow:0 8px 30px rgba(0,0,0,.12)" />
      </div>
    </div>
    <noscript>
      <main>
        <h1>ND WORLD - Boutique en ligne au Senegal</h1>
        <p>
          ND WORLD propose une selection de montres, chaussures, sacs, accessoires et produits tendance avec livraison a Dakar et partout au Senegal.
        </p>
        <nav aria-label="Navigation principale">
          <a href="/categories">Voir les categories</a>
          <a href="/produits/hermes">Voir les nouveautes</a>
          <a href="/produits/montre-classe">Voir les produits populaires</a>
        </nav>
      </main>
      <p>Activez JavaScript pour utiliser la boutique complete ND WORLD.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
