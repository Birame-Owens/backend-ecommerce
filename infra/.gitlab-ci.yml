stages:
  - test
  - build
  - deploy

variables:
  APP_ENV: testing
  APP_DEBUG: "true"
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: vivias_test
  DB_USERNAME: postgres
  DB_PASSWORD: postgres
  CACHE_STORE: array
  SESSION_DRIVER: array
  QUEUE_CONNECTION: sync
  MAIL_MAILER: array
  POSTGRES_DB: vivias_test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres

backend_tests:
  stage: test
  image: php:8.2-cli
  services:
    - name: postgres:16-alpine
      alias: postgres
  cache:
    key:
      files:
        - composer.lock
    paths:
      - vendor/
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates curl git unzip libpq-dev libzip-dev libpng-dev libjpeg-dev libfreetype6-dev
    - docker-php-ext-configure gd --with-freetype --with-jpeg
    - docker-php-ext-install pdo_pgsql zip gd bcmath
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --no-interaction --prefer-dist --no-progress
    - cp .env.example .env
    - php artisan key:generate --ansi
    - php artisan config:clear --ansi
    - mkdir -p tests/Reports
  script:
    - php artisan migrate --force --ansi
    - php artisan test --ansi --log-junit tests/Reports/junit.xml
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - storage/logs/
      - tests/Reports/
    reports:
      junit: tests/Reports/junit.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

frontend_build:
  stage: build
  image: node:20-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run build
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - public/build/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

deploy_production:
  stage: deploy
  image: alpine:3.20
  needs:
    - backend_tests
    - frontend_build
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$DEPLOY_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd $DEPLOY_PATH && git pull origin main && docker compose -f docker-compose.yml up -d --build && docker compose exec -T backend php artisan migrate --force"
  environment:
    name: production
    url: https://vivias-shop.com
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
