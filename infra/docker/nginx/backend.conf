# Pool PHP-FPM avec keepalive — évite de recréer une connexion TCP par requête
upstream php_fpm {
    server backend:9000;
    keepalive 32;
}

server {
    listen 80 default_server;
    server_name _;

    root /app/public;
    index index.php;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Timeouts PHP-FPM — augmentés pour absorber les pics de charge
    fastcgi_connect_timeout  10s;
    fastcgi_read_timeout     60s;
    fastcgi_send_timeout     60s;

    # Buffers — évite les écritures disque temporaires sous charge
    fastcgi_buffer_size      32k;
    fastcgi_buffers          16 32k;
    fastcgi_busy_buffers_size 64k;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /storage/ {
        alias /app/storage/app/public/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location ~ \.php$ {
        fastcgi_pass php_fpm;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        # Keepalive FastCGI
        fastcgi_keep_conn on;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
