# Rate limiting : 30 req/s par IP (burst 60 sans délai)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
# Rate limiting strict pour auth : 5 req/min par IP
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

server {
    listen 80 default_server;
    server_name _;

    root /app/public;
    index index.php;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Timeout PHP-FPM
    fastcgi_connect_timeout 10s;
    fastcgi_read_timeout    30s;
    fastcgi_send_timeout    30s;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Rate limit sur les routes auth
    location ~* ^/api/(admin/login|client/auth/login|client/auth/register) {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_req_status 429;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Rate limit général API
    location /api/ {
        limit_req zone=api_limit burst=80 nodelay;
        limit_req_status 429;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /storage/ {
        alias /app/storage/app/public/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location ~ \.php$ {
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
