# ── Cache FastCGI ─────────────────────────────────────────────────────────────
# GET /api/client/* servis depuis RAM — PHP-FPM pas touché
fastcgi_cache_path /tmp/nginx_fcgi_cache
    levels=1:2
    keys_zone=api_public:20m
    max_size=200m
    inactive=3m
    use_temp_path=off;

# Décision de cache — WHITELIST : on ne cache QUE les routes publiques de lecture
# (identiques pour tous). Tout le reste reste privé par défaut. Les réponses
# publiques ne portent plus de Set-Cookie (session découplée côté Laravel).
map $request_uri $is_public_cacheable {
    default                              0;
    "~^/api/client/home"                 1;
    "~^/api/client/featured-products"    1;
    "~^/api/client/new-arrivals"         1;
    "~^/api/client/products-on-sale"     1;
    "~^/api/client/categories-preview"   1;
    "~^/api/client/active-promotions"    1;
    "~^/api/client/shop-stats"           1;
    "~^/api/client/testimonials"         1;
    "~^/api/client/navigation"           1;
    "~^/api/client/products"             1;
    "~^/api/client/categories"           1;
    "~^/api/client/search"               1;
    "~^/api/client/delivery-zones"       1;
    "~^/api/client/config"               1;
}

server {
    listen 80 default_server;
    server_name _;

    root /app/public;
    index index.php;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    fastcgi_connect_timeout  10s;
    fastcgi_read_timeout     60s;
    fastcgi_send_timeout     60s;
    fastcgi_buffer_size      32k;
    fastcgi_buffers          16 32k;
    fastcgi_busy_buffers_size 64k;

    # ── Décision de cache (whitelist : GET + route publique connue) ────────────
    set $skip_cache 1;
    if ($request_method = GET)      { set $skip_cache 0; }
    if ($is_public_cacheable = 0)   { set $skip_cache 1; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /storage/ {
        alias /app/storage/app/public/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location ~ \.php$ {
        fastcgi_pass   backend:9000;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;
        fastcgi_keep_conn on;

        # Cache — on ignore le "Cache-Control: no-cache, private" par défaut de
        # Laravel ; la whitelist $skip_cache est la seule autorité (Set-Cookie reste
        # respecté donc une réponse avec cookie n'est jamais mise en cache).
        fastcgi_ignore_headers   Cache-Control Expires;
        fastcgi_cache            api_public;
        fastcgi_cache_key        "$request_method|$host|$request_uri";
        fastcgi_cache_valid       200 2m;
        fastcgi_cache_valid       404 30s;
        fastcgi_cache_bypass     $skip_cache;
        fastcgi_no_cache         $skip_cache;
        fastcgi_cache_lock       on;
        fastcgi_cache_lock_timeout 3s;
        fastcgi_cache_use_stale  error timeout updating http_500 http_503;

        add_header X-Cache-Status $upstream_cache_status always;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
