server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Assets JS/CSS hashés — cache 1 an
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Fichiers statiques racine
    location ~* \.(ico|png|jpg|jpeg|svg|webp|woff2?|ttf)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # Proxy API → backend Nginx
    location /api/ {
        proxy_pass         http://nginx:80;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Proxy images/fichiers uploadés
    location /storage/ {
        proxy_pass       http://nginx:80;
        proxy_set_header Host $host;
        access_log off;
    }

    # Proxy Sanctum (cookies auth SPA)
    location /sanctum/ {
        proxy_pass         http://nginx:80;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SPA fallback — toutes les routes React → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
