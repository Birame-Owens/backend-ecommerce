[www]
user  = www-data
group = www-data

listen = 9000
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

; ondemand : workers crées à la demande, détruits après idle (adapté PaaS)
; Le cache Nginx prend en charge 95%+ des GET publics → PHP rarément sollicité
; 25 workers × 45 MB = ~1125 MB max, laisse de la marge pour Nginx/OS/DB
pm                        = ondemand
pm.max_children           = 25
pm.process_idle_timeout   = 10s
pm.max_requests           = 500

; Tuer les requetes bloquees apres 60s
request_terminate_timeout = 60s

; Logs slow requests (> 3s) dans le log PHP-FPM
slowlog                   = /proc/self/fd/2
request_slowlog_timeout   = 3s

; Status endpoint (consulte par health check)
pm.status_path = /fpm-status

; Variables d'environnement transmises aux workers
clear_env = no
