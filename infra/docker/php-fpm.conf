[www]
user  = www-data
group = www-data

listen = 9000
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

; Serveur a 3.73 GiB RAM, chaque worker ~45 MB
; 35 workers = ~1575 MB max alloues au backend
pm                   = dynamic
pm.max_children      = 35
pm.start_servers     = 10
pm.min_spare_servers = 8
pm.max_spare_servers = 20
; Recycle les workers apres 500 requetes pour eviter les fuites memoire
pm.max_requests      = 500

; Tuer les requetes bloquees apres 60s
request_terminate_timeout = 60s

; Logs slow requests (> 3s) dans le log PHP-FPM
slowlog                   = /proc/self/fd/2
request_slowlog_timeout   = 3s

; Status endpoint (consulte par health check)
pm.status_path = /fpm-status

; Variables d'environnement transmises aux workers
clear_env = no
